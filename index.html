<style>

  :root{
    --bg:#000000;
    --panel:#141414;
    --panel2:#1a1a1a;
    --border:#2A2A2A;
    --ink:#D0D0D0;
    --ink-bright:#FFFFFF;
    --dim:#8C8C8C;
    --foot:#9A9A9A;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Calibri,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:Cambria,Georgia,"Times New Roman",serif;
    color:var(--ink-bright);
    font-weight:400;
    margin:0;
  }
  a{color:inherit;}
  img{display:block;max-width:100%;height:auto;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}
  section{padding:76px 0;border-bottom:1px solid var(--border);}
  section:last-of-type{border-bottom:none;}
  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:18px;
  }
  h2{font-size:clamp(24px,5vw,32px);line-height:1.28;letter-spacing:.01em;}
  .lede{margin-top:18px;font-size:15.5px;color:var(--ink);max-width:56ch;}

  /* SCROLL PROGRESS */
  .progress{
    position:fixed;top:0;left:0;height:2px;width:100%;
    background:transparent;z-index:999;
    padding-top:env(safe-area-inset-top,0);
  }
  .progress-bar{height:2px;width:0%;background:var(--ink-bright);transform-origin:left;transition:width .08s linear;}

  /* BACK CHIP */
  .backchip{
    position:fixed;z-index:200;
    top:calc(14px + env(safe-area-inset-top,0px));left:14px;
    display:inline-flex;align-items:center;gap:7px;
    padding:9px 14px 9px 12px;
    font-size:12px;letter-spacing:.04em;
    color:var(--ink);text-decoration:none;
    background:rgba(0,0,0,.62);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease);
  }
  .backchip:hover{background:rgba(0,0,0,.85);border-color:var(--ink-bright);color:var(--ink-bright);}
  .backchip .ar{
    width:13px;height:1px;background:currentColor;position:relative;flex:0 0 auto;
  }
  .backchip .ar::after{
    content:'';position:absolute;left:0;top:50%;width:5px;height:5px;
    border-left:1px solid currentColor;border-bottom:1px solid currentColor;
    transform:translateY(-50%) rotate(45deg);
  }

  /* HERO */
  .hero{
    padding:0;
    border-bottom:1px solid var(--border);
    position:relative;
    overflow:hidden;
  }
  .hero-img-wrap{
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#0a0a0a;
    position:relative;
    opacity:0;
    transform:scale(1.04);
    transition:opacity 1.3s var(--ease),transform 1.8s var(--ease);
  }
  .hero-img-wrap.in{opacity:1;transform:scale(1);}
  .hero-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:grayscale(15%) contrast(1.05);}
  .hero-img-wrap::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to bottom,transparent 72%,rgba(0,0,0,.55) 88%,var(--bg) 100%);
  }
  .hero-content{
    padding:40px 24px 56px;
    max-width:640px;
    margin:0 auto;
    text-align:center;
  }
  .hero-logo{width:64px;height:64px;margin:0 auto 24px;object-fit:contain;}
  .hero h1{font-size:clamp(30px,8vw,42px);letter-spacing:.06em;}
  .hero-tag{
    margin-top:16px;
    font-family:Cambria,Georgia,serif;
    font-size:clamp(17px,4vw,20px);
    color:var(--ink-bright);
  }
  .hero-sub{margin-top:14px;font-size:14.5px;color:var(--dim);max-width:38ch;margin-left:auto;margin-right:auto;}

  /* CARDS */
  .cards{display:grid;gap:14px;margin-top:32px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    padding:22px 20px;
    transition:transform .35s var(--ease),border-color .35s var(--ease),background .35s var(--ease);
  }
  .card:hover{transform:translateY(-3px);border-color:#3d3d3d;background:var(--panel2);}
  .card .num{
    font-family:Cambria,Georgia,serif;
    font-size:13px;
    color:var(--dim);
    letter-spacing:.05em;
  }
  .card h3{font-size:16.5px;margin-top:8px;color:var(--ink-bright);font-family:Calibri,"Segoe UI",sans-serif;font-weight:600;}
  .card p{margin:8px 0 0;font-size:14px;color:var(--ink);}

  .cards.three{grid-template-columns:1fr;}
  @media(min-width:540px){.cards.three{grid-template-columns:repeat(3,1fr);}}

  /* PAIN CARDS — constat, sobre, cohérent avec le reste des cartes */
  .pain-card{
    display:flex;flex-direction:column;
  }
  .pain-card .pain-label{
    font-family:Calibri,"Segoe UI",sans-serif;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--dim);
    min-height:14px;
    margin-bottom:12px;
  }
  .pain-card .pain-line{
    position:relative;
    height:1px;
    background:var(--border);
    margin-bottom:14px;
    overflow:hidden;
  }
  .pain-card .pain-line::after{
    content:'';
    position:absolute;left:0;top:0;bottom:0;
    width:0%;
    background:var(--ink-bright);
    transition:width 1.1s var(--ease);
  }
  .pain-card.on .pain-line::after{width:100%;}
  .pain-card .pain-word{
    font-size:16.5px;
    color:var(--ink-bright);
    font-family:Calibri,"Segoe UI",sans-serif;
    font-weight:600;
  }
  .pain-card p{margin-top:8px;}

  /* stagger for grid children */
  .cards .card:nth-child(1){transition-delay:0s;}
  .cards .card:nth-child(2){transition-delay:.08s;}
  .cards .card:nth-child(3){transition-delay:.16s;}
  .cards .card:nth-child(4){transition-delay:.24s;}

  /* IMAGE BAND */
  .band{width:100%;aspect-ratio:16/10;overflow:hidden;margin-top:36px;border:1px solid var(--border);position:relative;}
  .band::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to bottom,transparent 80%,rgba(0,0,0,.92) 100%),
      radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%);
  }
  .band img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);will-change:transform;}
  .band.square{aspect-ratio:4/3.3;}
  .band-caption{margin-top:12px;font-size:11.5px;letter-spacing:.05em;color:var(--dim);text-align:center;}

  /* LOGO PAUSE PANEL */
  .logo-pause{
    margin-top:36px;
    aspect-ratio:1.9/1;
    border:1px solid var(--border);
    background:#050505;
    display:flex;align-items:center;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .logo-pause::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at center,rgba(255,255,255,.1) 0%,transparent 65%);
  }
  .logo-pause img{
    width:42%;max-width:320px;height:auto;object-fit:contain;
    animation:breathe 4.5s ease-in-out infinite;
    position:relative;z-index:1;
  }
  @keyframes breathe{
    0%,100%{opacity:.6;transform:scale(1);}
    50%{opacity:1;transform:scale(1.1);}
  }

  /* SPEC LIST */
  .spec{margin-top:32px;border-top:1px solid var(--border);}
  .spec-row{
    display:flex;justify-content:space-between;gap:20px;
    padding:16px 0;border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .spec-row .k{color:var(--dim);flex:0 0 40%;}
  .spec-row .v{color:var(--ink);flex:1;}

  .subhead{margin-top:52px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
  .subhead + .timeline{margin-top:20px;}
  .lede + .timeline{margin-top:36px;}

  /* TECHNICAL TIMELINE */
  .timeline{position:relative;display:flex;flex-direction:column;gap:0;}
  .timeline-track{
    position:absolute;left:5px;top:6px;bottom:6px;width:1px;
    background:var(--border);
  }
  .timeline-track-fill{
    position:absolute;left:0;top:0;width:1px;height:0%;
    background:var(--ink-bright);
    transition:height 1.4s var(--ease);
  }
  .timeline-item{position:relative;padding:0 0 30px 30px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{
    position:absolute;left:0px;top:5px;width:11px;height:11px;border-radius:50%;
    background:var(--bg);border:1px solid var(--border);
    transition:border-color .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease);
  }
  .timeline-item.on .timeline-dot{background:var(--ink-bright);border-color:var(--ink-bright);box-shadow:0 0 0 3px rgba(255,255,255,.12);}
  .timeline-item .num{
    font-family:Cambria,Georgia,serif;
    font-size:13px;color:var(--dim);letter-spacing:.05em;
  }
  .timeline-item p{margin:8px 0 0;font-size:14px;color:var(--ink);}

  /* Primary timeline (rituel) — same connected-dot animation, more prominent */
  .timeline.primary .timeline-item{padding-bottom:34px;}
  .timeline.primary .timeline-dot{width:13px;height:13px;top:4px;}
  .timeline.primary .timeline-track{left:6px;}
  .timeline.primary .timeline-item .num{font-size:16px;color:var(--ink-bright);letter-spacing:.02em;font-weight:600;}
  .timeline.primary .timeline-item p{font-size:14.5px;max-width:56ch;}

  /* FAQ — accordion */
  .faq{margin-top:32px;display:flex;flex-direction:column;}
  .faq-item{border-top:1px solid var(--border);}
  .faq-item:last-child{border-bottom:1px solid var(--border);}
  .faq-q{
    width:100%;margin:0;background:none;border:none;padding:20px 0;
    display:flex;align-items:center;justify-content:space-between;gap:18px;
    font-family:Cambria,Georgia,serif;font-size:17px;color:var(--ink-bright);
    text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .faq-q:hover{color:var(--ink-bright);}
  .faq-arrow{flex:0 0 auto;width:16px;height:16px;position:relative;transition:transform .4s var(--ease);}
  .faq-arrow::before,.faq-arrow::after{content:'';position:absolute;background:var(--ink-bright);transition:transform .3s var(--ease),opacity .3s var(--ease);}
  .faq-arrow::before{left:0;top:7px;width:16px;height:1px;}
  .faq-arrow::after{left:7px;top:0;width:1px;height:16px;}
  .faq-item.open .faq-arrow{transform:rotate(180deg);}
  .faq-item.open .faq-arrow::after{opacity:0;}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .5s var(--ease);}
  .faq-a-inner{padding:0 0 22px;font-size:14px;color:var(--ink);line-height:1.75;max-width:52ch;}

  /* PRICING — compact & discreet */
  #tarifs{padding:44px 0;}
  #tarifs .eyebrow{margin-bottom:10px;}
  #tarifs h2{font-size:clamp(18px,3.6vw,22px);}
  .price-grid{display:grid;gap:10px;margin-top:18px;}
  @media(min-width:540px){.price-grid{grid-template-columns:1fr 1fr;}}
  .price-card{
    border:1px solid var(--border);
    background:var(--panel);
    padding:16px 14px;
    text-align:center;
    transition:transform .35s var(--ease),border-color .35s var(--ease);
  }
  .price-card:hover{transform:translateY(-2px);border-color:#3d3d3d;}
  .price-card .amount{
    font-family:Cambria,Georgia,serif;
    font-size:24px;
    color:var(--ink-bright);
  }
  .price-card .amount sup{font-size:11px;}
  .price-card .amount .per{font-size:12px;color:var(--dim);font-family:Calibri,"Segoe UI",sans-serif;margin-left:2px;}
  .price-card .label{margin-top:5px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);}
  .price-card .desc{margin-top:6px;font-size:11.5px;color:var(--dim);line-height:1.5;}

  /* Featured / subscription card — effet classe, mis en avant */
  .price-card.featured{
    position:relative;
    overflow:hidden;
    border-color:var(--ink-bright);
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 14px 34px rgba(255,255,255,.05);
  }
  .price-card.featured .price-tag{
    display:inline-block;
    font-family:Calibri,"Segoe UI",sans-serif;
    font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:#000;background:var(--ink-bright);
    padding:4px 10px;
    margin-bottom:10px;
  }
  .price-card.featured::after{
    content:'';
    position:absolute;top:0;left:-60%;width:36%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,.16),transparent);
    transform:skewX(-20deg);
    opacity:0;
    pointer-events:none;
  }
  .price-card.featured.shine::after{
    animation:priceShine 1.3s var(--ease) .3s 1;
  }
  @keyframes priceShine{
    0%{opacity:0;left:-60%;}
    15%{opacity:1;}
    100%{opacity:0;left:130%;}
  }
  .price-fine{
    margin-top:10px;
    font-size:10.5px;
    color:var(--dim);
    letter-spacing:.02em;
  }
  .price-per-wash{
    margin-top:14px;
    display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
    padding:12px 14px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
  }
  .price-per-wash .ppw-old{
    font-size:13px;color:var(--dim);text-decoration:line-through;
    text-decoration-color:var(--dim);
  }
  .price-per-wash .ppw-arrow{color:var(--dim);font-size:13px;}
  .price-per-wash .ppw-new{
    font-family:Cambria,Georgia,serif;font-weight:400;
    font-size:28px;color:var(--ink-bright);line-height:1;
  }
  .price-per-wash .ppw-new sup{font-size:15px;}
  .price-per-wash .ppw-unit{
    font-family:Calibri,"Segoe UI",sans-serif;
    font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;
  }
  .price-note{
    margin-top:16px;
    border:1px solid var(--border);
    padding:14px 16px;
    font-size:12.5px;
    color:var(--dim);
  }
  .price-defense{
    margin-top:20px;
    font-size:13px;
    color:var(--ink);
    line-height:1.75;
    max-width:52ch;
  }
  .price-defense strong{color:var(--ink-bright);font-weight:600;}

  /* CTA buttons */
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px;justify-content:center;}
  .btn{
    display:inline-block;
    padding:14px 26px;
    font-family:inherit;
    font-size:14px;
    letter-spacing:.04em;
    text-decoration:none;
    text-align:center;
    background:none;
    border:1px solid var(--ink-bright);
    color:var(--ink-bright);
    appearance:none;-webkit-appearance:none;
    cursor:pointer;
    transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease);
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.solid{background:var(--ink-bright);color:#000;}

  /* PROOF / SCIENCE */
  .stat-chart{margin-top:36px;display:flex;flex-direction:column;gap:22px;}
  .stat-row .stat-label{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink);margin-bottom:8px;}
  .stat-row .stat-label .v{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;}
  .stat-track{height:8px;background:var(--panel);border:1px solid var(--border);overflow:hidden;}
  .stat-fill{height:100%;width:0%;background:var(--ink-bright);transition:width 1.1s var(--ease);}
  .stat-row.dim .stat-fill{background:#6a6a6a;}
  .stat-caption{margin-top:6px;font-size:11.5px;color:var(--dim);letter-spacing:.03em;}

  .hero-stat{margin-top:32px;text-align:center;}
  .hero-stat .num{
    font-family:Cambria,Georgia,serif;
    font-size:clamp(48px,13vw,84px);
    color:var(--ink-bright);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .hero-stat .cap{margin-top:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}

  .stat-row.cyan .stat-fill{background:linear-gradient(90deg,#0891b2,#22d3ee);box-shadow:0 0 14px rgba(34,211,238,.45);}
  .stat-row.cyan .stat-label .v{color:#22d3ee;}

  /* Elegant reveal for numbers (stat %, prices) — pop in, no digit ticking */
  .reveal-pop{
    display:inline-block;
    opacity:0;transform:scale(.88);
    transition:opacity .9s var(--ease),transform .9s var(--ease);
  }
  .reveal-pop.in{opacity:1;transform:scale(1);}

  .proof-grid{display:grid;gap:14px;margin-top:36px;grid-template-columns:1fr;}
  @media(min-width:600px){.proof-grid{grid-template-columns:1fr 1fr;}}
  .proof-card{background:var(--panel);border:1px solid var(--border);padding:20px;transition:transform .35s var(--ease),border-color .35s var(--ease);}
  .proof-card:hover{transform:translateY(-3px);border-color:#3d3d3d;}
  .proof-card .proof-param{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);}
  .proof-card .proof-row{display:flex;align-items:baseline;gap:10px;margin-top:12px;font-family:Cambria,Georgia,serif;font-size:15px;color:var(--ink-bright);flex-wrap:wrap;}
  .proof-card .proof-row .before{color:#8C8C8C;font-size:13.5px;}
  .proof-card .proof-row .arrow{color:#5a5a5a;font-family:Calibri,sans-serif;}
  .proof-card .proof-row .after{color:var(--ink-bright);}
  .proof-card .proof-gain{margin-top:10px;font-size:12.5px;color:var(--dim);}

  .method-note{
    margin-top:28px;
    border:1px solid var(--border);
    background:var(--panel);
    padding:20px 22px;
    font-size:12.5px;
    color:var(--dim);
    line-height:1.65;
  }
  .method-note strong{color:var(--ink);font-weight:600;}

  /* Detail toggle button — opens the technical section below */
  .detail-toggle{
    margin-top:26px;
    display:inline-flex;align-items:center;gap:12px;
    background:none;border:1px solid var(--border);
    padding:13px 22px;
    font-family:Calibri,"Segoe UI",sans-serif;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-bright);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:border-color .3s var(--ease),background .3s var(--ease);
  }
  .detail-toggle:hover{border-color:var(--ink-bright);}
  .detail-toggle .chevron{
    flex:0 0 auto;width:8px;height:8px;
    border-right:1px solid var(--ink-bright);border-bottom:1px solid var(--ink-bright);
    transform:rotate(45deg);transition:transform .4s var(--ease);
  }
  .detail-toggle.open .chevron{transform:rotate(-135deg);}

  /* Technical section — collapsed by default, expands on toggle */
  #technique{padding:0;border-bottom:none;}
  #technique.open{border-bottom:1px solid var(--border);}
  .tech-collapse{max-height:0;overflow:hidden;transition:max-height .6s var(--ease);}
  .tech-inner{padding:76px 0;}

  /* VISION */
  .vision{text-align:center;}
  .vision h2{font-size:clamp(22px,4.6vw,30px);max-width:34ch;margin:0 auto;}
  .vision .lede{max-width:48ch;margin-left:auto;margin-right:auto;}

  /* CONTACT */
  .contact-wrap{text-align:center;}
  .contact-priority{
    margin-top:22px;
    font-size:12.5px;
    color:var(--dim);
    max-width:44ch;
    margin-left:auto;margin-right:auto;
  }
  .contact-priority strong{color:var(--ink-bright);font-weight:600;}

  /* CONTACT MODAL */
  .contact-overlay{
    position:fixed;inset:0;z-index:1000;
    background:rgba(0,0,0,.72);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    opacity:0;transition:opacity .3s var(--ease);
  }
  .contact-overlay.open{opacity:1;}
  .contact-overlay[hidden]{display:none;}
  .contact-modal{
    position:relative;
    width:100%;max-width:360px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:32px 26px 28px;
    text-align:center;
    transform:scale(.94);transition:transform .3s var(--ease);
  }
  .contact-overlay.open .contact-modal{transform:scale(1);}
  .contact-modal-close{
    position:absolute;top:10px;right:10px;
    width:32px;height:32px;
    background:none;border:none;color:var(--dim);
    font-size:20px;line-height:1;cursor:pointer;
    transition:color .25s var(--ease);
  }
  .contact-modal-close:hover{color:var(--ink-bright);}
  .contact-modal-row{
    margin-top:14px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .contact-modal-value{
    font-family:Cambria,Georgia,serif;
    font-size:18px;
    color:var(--ink-bright);
    word-break:break-word;
  }
  .contact-modal-copy{
    flex:0 0 auto;
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:1px solid var(--border);
    color:var(--ink);
    cursor:pointer;
    transition:border-color .25s var(--ease),color .25s var(--ease);
  }
  .contact-modal-copy:hover{border-color:var(--ink-bright);color:var(--ink-bright);}
  .contact-modal-copied{
    display:block;
    margin-top:8px;
    font-size:11.5px;
    letter-spacing:.05em;
    color:#22d3ee;
    height:14px;
    opacity:0;transition:opacity .25s var(--ease);
  }
  .contact-modal-copied.show{opacity:1;}
  .contact-modal-action{margin-top:22px;width:100%;}

  footer{
    padding:40px 24px 60px;
    text-align:center;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--foot);
    text-transform:uppercase;
  }
  footer img{width:22px;height:22px;margin:0 auto 14px;object-fit:contain;opacity:.7;}
  .footer-links{
    margin-top:14px;
    display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;
    text-transform:none;letter-spacing:.02em;
    font-size:10.5px;
  }
  .footer-links a{color:var(--foot);text-decoration:underline;text-underline-offset:2px;}
  .footer-links a:hover{color:var(--ink);}
  .footer-links span{opacity:.4;}

  .fade{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
  .fade.in{opacity:1;transform:none;}

  @media(prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .fade{opacity:1!important;transform:none!important;transition:none!important;}
    .reveal-pop{opacity:1!important;transform:none!important;transition:none!important;}
    .hero-img-wrap{opacity:1!important;transform:none!important;transition:none!important;}
    .contact-overlay,.contact-modal{transition:none!important;}
    .faq-a{transition:none!important;}
    .tech-collapse{transition:none!important;}
    .detail-toggle .chevron{transition:none!important;}
    .card,.price-card,.proof-card,.btn{transition:none!important;}
    .card:hover,.price-card:hover,.proof-card:hover{transform:none!important;}
    .band img,.hero-img-wrap img{transform:none!important;}
    .stat-fill{transition:none!important;}
    .logo-pause img{animation:none!important;opacity:.85!important;}
    .timeline-track-fill{transition:none!important;}
    .price-card,.proof-card{transform:none!important;}
    .pain-line::after{transition:none!important;}
    .price-card.featured::after{display:none!important;}
  }


  /* ---- TRANSITIONS DE PAGE ---- */
  .page-veil{
    position:fixed;inset:0;z-index:9998;background:var(--bg);
    pointer-events:none;opacity:1;
    transition:opacity .6s var(--ease);
  }
  body.loaded .page-veil{opacity:0;}
  body.leaving .page-veil{opacity:1;transition:opacity .32s var(--ease);}
  .page-lift{
    opacity:0;transform:translateY(12px);
    transition:opacity .75s var(--ease) .06s,transform .75s var(--ease) .06s;
  }
  body.loaded .page-lift{opacity:1;transform:none;}
  body.leaving .page-lift{opacity:0;transform:translateY(-8px);transition:opacity .3s var(--ease),transform .3s var(--ease);}
  @media(prefers-reduced-motion: reduce){
    .page-veil{display:none!important;}
    .page-lift{opacity:1!important;transform:none!important;transition:none!important;}
  }


  body{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

  .bg-layer{
    position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    opacity:0;transition:opacity 2.4s var(--ease) .2s;
  }
  body.loaded .bg-layer{opacity:1;}
  .bg-layer img{
    width:100%;height:100%;object-fit:cover;object-position:center 28%;
    filter:grayscale(60%) contrast(.95) brightness(.24) blur(4px);
    transform:scale(1.14);
  }
  .bg-layer::after{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.45) 0%,rgba(0,0,0,.9) 60%,#000 100%),
      linear-gradient(to bottom,#000,rgba(0,0,0,.82) 40%,rgba(0,0,0,.82) 60%,#000 100%);
  }

  .shell{position:relative;z-index:1;flex:1;display:flex;align-items:center;}
  .menu{width:100%;max-width:520px;margin:0 auto;padding:54px 22px;}

  .m-item{
    position:relative;display:block;text-decoration:none;
    border:1px solid var(--border);
    background:rgba(16,16,16,.66);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    padding:24px 22px;
    margin-bottom:11px;
    opacity:0;transform:translateY(16px);
    transition:
      opacity .9s var(--ease),transform .9s var(--ease),
      border-color .35s var(--ease),background .35s var(--ease);
  }
  .m-item:last-of-type{margin-bottom:0;}
  body.loaded .m-item{opacity:1;transform:none;}
  body.loaded .m-item:nth-of-type(1){transition-delay:.3s,.3s,0s,0s;}
  body.loaded .m-item:nth-of-type(2){transition-delay:.42s,.42s,0s,0s;}
  body.loaded .m-item:nth-of-type(3){transition-delay:.54s,.54s,0s,0s;}

  .m-item:hover,.m-item:focus-visible{
    border-color:#454545;
    background:rgba(24,24,24,.9);
    outline:none;
  }

  .m-title{
    display:block;
    font-family:Cambria,Georgia,"Times New Roman",serif;
    font-size:clamp(20px,5.2vw,24px);
    color:var(--ink-bright);line-height:1.2;letter-spacing:.01em;
  }

  /* trait blanc — se dessine à l'apparition, se redessine sur la carte active */
  /* le trait et la flèche forment une seule ligne continue */
  .m-rule{
    display:flex;align-items:center;gap:0;
    margin:13px 0 12px;
  }
  .m-line{
    display:block;flex:1;
    position:relative;height:1px;background:var(--border);overflow:hidden;
  }
  .m-line::after{
    content:'';position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--ink-bright);
    transition:width 1.1s var(--ease);
  }
  body.loaded .m-item:nth-of-type(1) .m-line::after{width:100%;transition-delay:.6s;}
  body.loaded .m-item:nth-of-type(2) .m-line::after{width:100%;transition-delay:.74s;}
  body.loaded .m-item:nth-of-type(3) .m-line::after{width:100%;transition-delay:.88s;}
  .m-item:hover .m-line::after,
  .m-item:focus-visible .m-line::after{
    animation:lineSweep 1s var(--ease) 1;
  }
  @keyframes lineSweep{
    0%{width:0%;}
    100%{width:100%;}
  }

  .m-desc{display:block;font-size:12.5px;color:var(--dim);line-height:1.5;}

  .m-arrow{
    flex:0 0 auto;position:relative;
    width:16px;height:1px;background:var(--border);
    transition:background .35s var(--ease),width .35s var(--ease);
  }
  .m-arrow::after{
    content:'';position:absolute;right:0;top:50%;
    width:6px;height:6px;border-top:1px solid var(--dim);border-right:1px solid var(--dim);
    transform:translateY(-50%) rotate(45deg);
    transition:border-color .35s var(--ease);
  }
  body.loaded .m-item:nth-of-type(1) .m-arrow{background:var(--ink-bright);transition-delay:1.7s;}
  body.loaded .m-item:nth-of-type(2) .m-arrow{background:var(--ink-bright);transition-delay:1.84s;}
  body.loaded .m-item:nth-of-type(3) .m-arrow{background:var(--ink-bright);transition-delay:1.98s;}
  body.loaded .m-item:nth-of-type(1) .m-arrow::after{border-color:var(--ink-bright);transition-delay:1.7s;}
  body.loaded .m-item:nth-of-type(2) .m-arrow::after{border-color:var(--ink-bright);transition-delay:1.84s;}
  body.loaded .m-item:nth-of-type(3) .m-arrow::after{border-color:var(--ink-bright);transition-delay:1.98s;}
  .m-item:hover .m-arrow{width:22px;}

  @media(max-width:400px){
    .m-item{padding:22px 18px;}
  }

  @media(prefers-reduced-motion: reduce){
    .bg-layer,.m-item{opacity:1!important;transform:none!important;transition:none!important;}
    .m-line::after{width:100%!important;transition:none!important;animation:none!important;}
  }

  /* ============================================================
     ORDINATEUR — le site garde exactement les proportions
     du téléphone : une colonne de largeur mobile, centrée,
     et aucune taille qui grandit avec l'écran.
     ============================================================ */
  @media (min-width: 620px){

    /* toute la page tient dans une largeur de téléphone */
    body{
      max-width: 430px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      zoom: 1.2;
    }

    /* les conteneurs internes ne bornent plus rien de plus */
    .wrap,
    .hero-content,
    .menu,
    .inner,
    .topbar-in{
      max-width: none !important;
    }

    /* aucune grille ne se déplie */
    .cards.three,
    .price-grid,
    .proof-grid,
    .versus,
    .grid2{
      grid-template-columns: 1fr !important;
    }

    /* la barre collante suit la colonne */
    .sticky-cta{
      left: 50% !important;
      right: auto !important;
      transform: translateX(-50%) !important;
      width: 430px !important;
      max-width: 430px !important;
    }
    .sticky-cta.in{ transform: translateX(-50%) !important; }
    .sticky-in{ max-width: none !important; }

    /* le fond d'ambiance de l'accueil reste plein écran */
    .bg-layer{ width: 100vw !important; left: 50% !important; margin-left: -50vw !important; }
  }

  /* la pastille retour reste au coin de l'écran */
  @media (min-width: 620px){
    .backchip{ left: 14px !important; }
  }


  /* proportions figees a celles d'un telephone */
  @media (min-width: 620px){
    h2{font-size:24.0px !important;}
    .hero h1{font-size:31.2px !important;}
    .hero-tag{font-size:17.0px !important;}
    #tarifs h2{font-size:18.0px !important;}
    .hero-stat .num{font-size:50.7px !important;}
    .vision h2{font-size:22.0px !important;}
    .m-title{font-size:20.28px !important;}
  }

</style>

<script>
/* ---- NEPHELE — transitions de page ---- */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* ---------- transitions de page ---------- */
  function veilIn(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('loaded'); });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', veilIn);
  } else { veilIn(); }

  window.addEventListener('pageshow', function(e){
    document.body.classList.remove('leaving');
    if(e.persisted) document.body.classList.add('loaded');
  });

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]');
    if(!a) return;
    if(a.target === '_blank' || a.hasAttribute('download')) return;
    var href = a.getAttribute('href');
    if(!href || href.charAt(0) === '#' || /^(mailto:|tel:|https?:)/i.test(href)) return;
    if(e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    if(reduce){ window.location.href = href; return; }
    document.body.classList.add('leaving');
    setTimeout(function(){ window.location.href = href; }, 330);
  });

})();

/* ---- NEPHELE — socle d'animations partagé ---- */
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.NEPH = { reduce: reduce };

  /* ---------- helper observer ---------- */
  function watch(nodes, cb, threshold, stagger){
    if(!nodes.length) return;
    if(reduce || !('IntersectionObserver' in window)){
      Array.prototype.forEach.call(nodes, function(n){ cb(n); });
      return;
    }
    var o = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var i = Array.prototype.indexOf.call(nodes, en.target);
        if(stagger){ setTimeout(function(){ cb(en.target); }, i * stagger); }
        else { cb(en.target); }
        o.unobserve(en.target);
      });
    }, { threshold: threshold || 0.12 });
    Array.prototype.forEach.call(nodes, function(n){ o.observe(n); });
  }
  window.NEPH.watch = watch;

  document.addEventListener('DOMContentLoaded', function(){

    /* apparition des sections */
    watch(document.querySelectorAll('.fade'), function(el){ el.classList.add('in'); }, 0.12);

    /* chiffres — pop */
    watch(document.querySelectorAll('.reveal-pop'), function(el){ el.classList.add('in'); }, 0.5);

    /* jauges */
    watch(document.querySelectorAll('.stat-row'), function(row){
      var f = row.querySelector('.stat-fill');
      if(f) f.style.width = (f.getAttribute('data-target') || 0) + '%';
    }, 0.35, 140);

    /* traits blancs (pain-card, incl-item, life-row) */
    watch(document.querySelectorAll('[data-line]'), function(el){ el.classList.add('on'); }, 0.3, 150);

    /* barre de progression */
    var bar = document.getElementById('progressBar');
    if(bar){
      var tick = function(){
        var h = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
      };
      window.addEventListener('scroll', tick, {passive:true});
      window.addEventListener('resize', tick);
      tick();
    }

    /* accordéons */
    document.querySelectorAll('.faq-q').forEach(function(btn){
      btn.addEventListener('click', function(){
        var open = btn.getAttribute('aria-expanded') === 'true';
        var panel = btn.nextElementSibling;
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        panel.style.maxHeight = open ? null : panel.scrollHeight + 'px';
      });
    });

    /* balayage lumineux ponctuel */
    watch(document.querySelectorAll('[data-shine]'), function(el){ el.classList.add('shine'); }, 0.5);

    /* parallaxe douce des bandeaux images */
    var bands = document.querySelectorAll('.band img');
    if(bands.length && !reduce){
      var raf = false;
      var para = function(){
        bands.forEach(function(img){
          var r = img.parentElement.getBoundingClientRect();
          if(r.bottom < -200 || r.top > window.innerHeight + 200) return;
          var p = (r.top + r.height/2 - window.innerHeight/2) / window.innerHeight;
          img.style.transform = 'scale(1.12) translateY(' + (p * -22) + 'px)';
        });
        raf = false;
      };
      window.addEventListener('scroll', function(){
        if(!raf){ raf = true; requestAnimationFrame(para); }
      }, {passive:true});
      para();
    }
  });
})();

/* ---- trait vertical des chronologies (même jeu que la présentation) ---- */
(function(){
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('[data-timeline]').forEach(function(tl){
      var fill  = tl.querySelector('.timeline-track-fill');
      var items = tl.querySelectorAll('.timeline-item');
      if(!items.length) return;
      var play = function(){
        if(window.NEPH.reduce){
          items.forEach(function(it){ it.classList.add('on'); });
          if(fill) fill.style.height = '100%';
          return;
        }
        items.forEach(function(it, idx){
          setTimeout(function(){
            it.classList.add('on');
            if(fill) fill.style.height = (((idx + 1) / items.length) * 100) + '%';
          }, idx * 180);
        });
      };
      if(!('IntersectionObserver' in window) || window.NEPH.reduce){ play(); return; }
      var o = new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ play(); o.unobserve(e.target); } });
      },{threshold:0.35});
      o.observe(tl);
    });
  });
})();

</script>
